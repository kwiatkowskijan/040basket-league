@for (team of teamsInTournament.slice(0, maxVisibleTeams); track $index) {
<p>{{ team.name }}</p>
}

@if (teamsInTournament.length > maxVisibleTeams) {
<button (click)="loadMoreTeams()">Show all</button>
}

<form [formGroup]="addTeamForm" (ngSubmit)="addTeamToTournament(addTeamForm)">
    <mat-form-field appearance="outline">
        <mat-label>Name</mat-label>
        <input matInput type="text" id="team-name" formControlName="name">
    </mat-form-field>
    <mat-form-field appearance="outline">
        <mat-label>City</mat-label>
        <input matInput type="text" id="team-city" formControlName="city">
    </mat-form-field>
    <button type="submit">Save</button>
</form>
