<div class="listing-filtering">
    <form>
        <mat-form-field appearance="outline">
            <mat-label>Search tournament</mat-label>
            <input matInput type="text" placeholder="Search tournament"/>
        </mat-form-field>
    </form>
    <a [routerLink]="['/tournament']">Add tournament</a>
</div>

<div class="listing-container">
    <app-tournament *ngFor="let tournament of tournamentList" [tournament]="tournament"></app-tournament>
</div>
