<div class="section-title">
    <h1>Team</h1>
</div>
<div class="section-container">
    <div class="above-items-container">
        <h2>Details</h2>
    </div>   
    <div class="items-container one-column">
        <div class="item">
            <div class="item-title-area">
                <h3>{{ team?.name }}</h3>
            </div>
            <div class="item-content">
                <p>{{ team?.city }}</p>
            </div>
        </div>
    </div>
    <div class="items-container two-columns">
        <div class="item">
            <div class="item-title-area">
                <h3>Stats</h3>
            </div>
        </div>
        <div class="item">
            <div class="item-title-area">
                <h3>Players</h3>
            </div>
        </div>
    </div>
</div>
